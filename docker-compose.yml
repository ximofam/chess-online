version: "3.8"

services:
  mysql:
    image: mysql:8.0
    container_name: mysql_container
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: ${DB_ROOT_PASSWORD}
      MYSQL_DATABASE: ${DB_NAME}
    ports:
      - "3307:3306"
    volumes:
      - mysql_data:/var/lib/mysql
    networks:
      - chess-online-network
    
  
  api:
    build:
      context: .
      dockerfile: ./docker/Dockerfile-api
    image: my-golang-api:latest 
    container_name: golang_api_container
    restart: unless-stopped
    ports:
      - "8080:8080" 
    depends_on:
      - mysql 
    env_file:
      - .env
    networks: 
      - chess-online-network

networks:
  chess-online-network:

volumes:
  mysql_data:
 